version: 0.4.0
pr_number: 48
new_features:
- title: Breaking change
  description: Raises the minimum dbt version to 1.10.0.
- description: Adds `dbt_utils.unique_combination_of_columns` tests to staging and
    end models. If a test fails, please [open an issue](https://github.com/fivetran/dbt_unified_rag/issues/new/choose).
bug_fixes:
- description: Fixes comment chunking and Jira status and priority joins to respect
    `source_relation`, so records no longer mix across unioned connections.
- description: Fixes `rag_jira_using_priorities` so that disabling it no longer causes
    the `int_rag_jira__issue_document` model to error.
under_the_hood:
- description: Updates yml column documentation to match model output.
contributors:
- name: Bishop Kammeraad
  github_handle: porkedchop
  contribution: Reported and fixed the `source_relation` scoping issue.
  pr_number: 45
date: '2026-11-18'
